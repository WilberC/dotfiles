# Shared across Linux/macOS/WSL2 via stow. Windows imports this file directly
# (see docs for the %APPDATA%\alacritty\alacritty.toml importer) — keep this
# file free of platform-specific keys like [terminal].shell.

[font]
size = 18.0

[font.normal]
family = "BerkeleyMono Nerd Font"

[font.bold]
family = "BerkeleyMono Nerd Font"
style = "Bold"

[font.italic]
family = "BerkeleyMono Nerd Font"
style = "Oblique"

[font.bold_italic]
family = "BerkeleyMono Nerd Font"
style = "Bold Oblique"

[window]
padding = { x = 10, y = 10 }
opacity = 1.0
decorations = "full"
startup_mode = "Maximized"

[cursor]
style = { shape = "Block", blinking = "Off" }

[scrolling]
history = 10000

[keyboard]
bindings = [
  { key = "N", mods = "Command", action = "None" },
  { key = "W", mods = "Command", action = "None" },
  { key = "N", mods = "Command|Shift", action = "CreateNewWindow" },
  { key = "W", mods = "Command|Shift", action = "Quit" },
  { key = "Up", chars = "\u001b[A" },
  { key = "Down", chars = "\u001b[B" },
  { key = "1", mods = "Control", chars = "\u001b[49;5u" },
  { key = "2", mods = "Control", chars = "\u001b[50;5u" },
  { key = "3", mods = "Control", chars = "\u001b[51;5u" },
  { key = "4", mods = "Control", chars = "\u001b[52;5u" },
  { key = "5", mods = "Control", chars = "\u001b[53;5u" },
  { key = "6", mods = "Control", chars = "\u001b[54;5u" },
  { key = "7", mods = "Control", chars = "\u001b[55;5u" },
  { key = "8", mods = "Control", chars = "\u001b[56;5u" },
  { key = "9", mods = "Control", chars = "\u001b[57;5u" },
  { key = "L", mods = "Control|Shift", action = "ClearHistory" },
  { key = "Q", mods = "Control|Shift", action = "Quit" },
]

[mouse]
bindings = [
  { mouse = "WheelUp", mods = "Control", action = "IncreaseFontSize" },
  { mouse = "WheelDown", mods = "Control", action = "DecreaseFontSize" },
]
