onboarding = false

[ui]
show_agent_labels_on_pane_borders = true

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "$title"],
  ["$provider", "$limit"],
  ["$context"],
]

[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "bottom-left"

[theme]
name = "catppuccin"
auto_switch = false

[[keys.command]]
key = "ctrl+shift+u"
type = "popup"
command = "bash ~/scripts/herdr-agent-usage"
width = "70%"
height = "60%"
description = "Agent Usage: open limits pane"

[[keys.command]]
key = "ctrl+shift+m"
type = "plugin_action"
command = "usagebar.refresh"
description = "Agent Usage: refresh sidebar meters"
