onboarding = false

[ui]
show_agent_labels_on_pane_borders = true

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "$title"],
  ["$provider", "$limit"],
  ["$context"],
]

[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "bottom-left"

[theme]
name = "catppuccin"
auto_switch = false

[keys]
# Temporary cross-platform workaround for remote image paste.
#
# In the current WSL2 workflow, Ctrl+V is reserved for text paste and Codex
# receives Alt+V for clipboard images. Keep this as one shared setting for
# now so all clients use the same working shortcut. If macOS/Linux later need
# a different key, replace this with platform-specific config layering after
# the upstream Herdr configuration work is settled.
remote_image_paste = "alt+v"

[[keys.command]]
key = "ctrl+shift+u"
type = "popup"
command = "bash ~/scripts/herdr-agent-usage"
width = "70%"
height = "60%"
description = "Agent Usage: open limits pane"

[[keys.command]]
key = "ctrl+shift+m"
type = "plugin_action"
command = "usagebar.refresh"
description = "Agent Usage: refresh sidebar meters"
