# tmux is intentionally opt-in: run `tmux` to start a session.
# With tmux 3.1+, this XDG path is loaded automatically.

# Keep new panes and windows in the current pane's directory.
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Familiar, prefix-based pane controls.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# General terminal behavior.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g history-limit 100000
set -g mouse on
set -g focus-events on
set -g status-position top
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi

# Reload after edits with Prefix + r.
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"
